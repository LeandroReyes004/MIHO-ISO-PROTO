<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="50%" stop-color="#120e20"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#673ab7"/>
    </linearGradient>
    <linearGradient id="wingGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Origami Crane / Mihon Bird Emblem -->
  <g transform="translate(256, 260) scale(1.15)" filter="url(#glow)">
    <!-- Back Wing -->
    <polygon points="-80,-110 -20,-30 40,-130 -10,-40" fill="url(#wingGrad2)" opacity="0.85"/>
    <!-- Main Body and Center Fold -->
    <polygon points="0,-140 -90,40 0,90 90,40" fill="url(#wingGrad1)"/>
    <!-- Front Wing Left -->
    <polygon points="0,-140 -150,-10 -60,50" fill="url(#wingGrad3)"/>
    <!-- Head / Beak Fold -->
    <polygon points="0,-140 25,-175 0,-155" fill="#f3e5f5"/>
    <!-- Tail Fold -->
    <polygon points="0,90 -20,150 15,100" fill="url(#wingGrad2)"/>
    <!-- Right Wing Accent -->
    <polygon points="0,-140 130,-20 50,55" fill="url(#wingGrad2)"/>
    <!-- Subtle Book/Page Line Folds -->
    <line x1="0" y1="-140" x2="0" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
  </g>
</svg>
